[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "herdr-talkback"
version = "0.1.0"
description = "Herdr socket router for role-based AI agent panes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

[project.scripts]
herdr-talkback = "herdr_talkback.cli:main"
herdr-talkback-plugin = "herdr_talkback.plugin:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools.package-data]
herdr_talkback = ["*.toml"]

[tool.setuptools.packages.find]
include = ["herdr_talkback*"]
