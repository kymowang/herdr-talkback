id = "herdr-talkback"
name = "Herdr Talkback"
version = "0.2.4"
min_herdr_version = "0.9.1"
description = "Queued agent messaging and configurable, agent-scoped recovery for Herdr"
platforms = ["linux", "macos", "windows"]

# 安装/更新时同步 agent skill（构建命令不接收运行时插件上下文）
[[build]]
command = ["python3", "install_skill.py"]
platforms = ["linux", "macos"]

[[build]]
command = ["python", "install_skill.py"]
platforms = ["windows"]

[[startup]]
command = ["herdr-talkback-plugin", "start"]

[[actions]]
id = "start"
title = "Start Talkback service"
contexts = ["workspace"]
command = ["herdr-talkback-plugin", "start"]

[[actions]]
id = "restart"
title = "Restart Talkback service"
contexts = ["workspace"]
command = ["herdr-talkback-plugin", "restart"]

[[actions]]
id = "check"
title = "Check Talkback configuration and Herdr connection"
contexts = ["workspace"]
command = ["herdr-talkback-plugin", "check"]

[[actions]]
id = "queue"
title = "Show Talkback message queue"
contexts = ["workspace"]
command = ["herdr-talkback-plugin", "queue"]

[[actions]]
id = "update-worker"
title = "Run a queued Talkback installation update"
contexts = ["workspace"]
command = ["herdr-talkback-plugin", "update-worker"]

[[panes]]
id = "service"
title = "Talkback service"
placement = "tab"
command = ["herdr-talkback-plugin", "serve"]
