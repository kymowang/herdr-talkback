# Editable rules. agents match pane labels, agent_types optionally match CLI types.
# max_per_30m = 0 means unlimited; rules are evaluated in order.

[[recovery_rules]]
id = "stream disconnected before completion"
agents = ["*"]
statuses = ["idle", "done", "blocked", "unknown"]
patterns = ["^\\s*\u25a0\\s*stream disconnected before completion:\\s*error sending request\\b"]
command = "continue"
window = "latest_turn"
max_per_30m = 0

[[recovery_rules]]
id = "request timed out"
agents = ["*"]
statuses = ["idle", "done", "blocked", "unknown"]
patterns = ["^\\s*\u25a0\\s*request\\s+timed\\s+out\\b"]
command = "continue"
window = "latest_turn"
max_per_30m = 0

[[recovery_rules]]
id = "api error"
agents = ["*"]
statuses = ["idle", "done"]
patterns = ["^\\s*\u25cf\\s*api error\\b"]
command = "continue"
window = "latest_turn"

[[recovery_rules]]
id = "rate limit"
agents = ["*"]
statuses = ["idle", "done"]
patterns = ["^\\s*\u25cf\\s*.*\\brate limit(?:ed)?\\b"]
command = "continue"
window = "latest_turn"

[[recovery_rules]]
id = "overloaded"
agents = ["*"]
statuses = ["idle", "done"]
patterns = ["^\\s*\u25cf\\s*.*\\boverloaded\\b"]
command = "continue"
window = "latest_turn"

[[recovery_rules]]
id = "connection error"
agents = ["*"]
statuses = ["idle", "done"]
patterns = ["^\\s*\u25cf\\s*connection error\\b"]
command = "continue"
window = "latest_turn"

[[recovery_rules]]
id = "temporarily unavailable"
agents = ["*"]
statuses = ["idle", "done"]
patterns = ["^\\s*\u25cf\\s*.*\\btemporarily unavailable\\b"]
command = "continue"
window = "latest_turn"

[[recovery_rules]]
id = "api error (blocked)"
agents = ["*"]
statuses = ["blocked", "unknown"]
patterns = ["api error"]
command = "continue"
window = "recent"

[[recovery_rules]]
id = "rate limit (blocked)"
agents = ["*"]
statuses = ["blocked", "unknown"]
patterns = ["rate limit"]
